name: Refresh university disclosures
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: university-disclosures
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Collect public data
        run: python3 2026-11-19-refresh.py
      - name: Publish checked records
        if: always()
        run: |
          git add -- data/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh university disclosures'
            git push
          fi
